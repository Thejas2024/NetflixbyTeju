<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Clone</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navbar -->
    <div class="nav" id="nav">
        <img src="Movieimgs/netflix-logo.png"
             alt="Netflix Logo"
             class="nav__logo">

        <img src="Movieimgs/netflix-avatar.png"
             alt="Netflix Avatar"
             class="nav__avatar">
    </div>


    <!-- Banner -->
    <header class="banner">

        <div class="banner__contents">

            <h1 class="banner__title">
                MONEY HEIST
            </h1>

            <div class="banner__buttons">
                <button class="banner__button">▶ Play</button>
                <button class="banner__button">+ My List</button>
            </div>

            <p class="banner__description">
                This is the story of professional robbers planning
                one of the biggest heists with the help of a professor.
            </p>

        </div>

        <div class="banner--fadeBottom"></div>

    </header>


    <!-- Netflix Originals -->
    <section class="row">

        <h2>NETFLIX ORIGINALS</h2>

        <div class="row__posters">

            <img src="Movieimgs/large-movie1.jpg" alt="Movie 1"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie2.jpg" alt="Movie 2"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie3.jpg" alt="Movie 3"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie4.jpg" alt="Movie 4"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/small-movie10.jpg" alt="Movie 5"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie6.jpg" alt="Movie 6"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie7.jpg" alt="Movie 7"
                class="row__poster row__posterLarge">

            <img src="Movieimgs/large-movie8.jpg" alt="Movie 8"
                class="row__poster row__posterLarge">

        </div>

    </section>


    <!-- Trending Now -->
    <section class="row">

        <h2>Trending Now</h2>

        <div class="row__posters">

            <img src="Movieimgs/small-movie46.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie1.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie2.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie3.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie4.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie6.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie7.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie8.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie9.jpg" alt="" class="row__poster">
            <img src="Movieimgs/small-movie10.jpg" alt="" class="row__poster">

        </div>

    </section>


    <!-- Top Rated -->

        <h2>Top Rated</h2>

        <div class="row__posters">
